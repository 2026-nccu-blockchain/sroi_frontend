server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 產出的檔名有 hash，可以長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # error_page 404 /404.html;
    # location = /404.html {
    #     root /usr/share/nginx/html;
    # }

    # error_page 500 503 /50x.html;
    # location = /50x.html {
    #     root /usr/share/nginx/html;
    # }
}
